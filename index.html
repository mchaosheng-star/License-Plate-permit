<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>License Plate Permit</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg: #e8eef2;
      --ink: #14202b;
      --muted: #5a6b78;
      --ok: #0f6b3c;
      --ok-bg: #d8f3e4;
      --bad: #9b1c1c;
      --bad-bg: #fde2e2;
      --line: #c5d0d8;
      --card: #ffffff;
      --accent: #1a5f8a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background:
        radial-gradient(ellipse at 10% 0%, #d4e4ef 0%, transparent 50%),
        radial-gradient(ellipse at 90% 20%, #cfe0d8 0%, transparent 45%),
        var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 1.25rem 1rem 3rem;
    }
    h1 {
      font-size: 1.45rem;
      margin: 0 0 .25rem;
      letter-spacing: -.02em;
    }
    .sub { color: var(--muted); font-size: .9rem; margin-bottom: 1.25rem; }
    .row {
      display: flex;
      gap: .5rem;
      flex-wrap: wrap;
      margin-bottom: .75rem;
    }
    input[type="text"] {
      flex: 1;
      min-width: 160px;
      padding: .7rem .85rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 1.15rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      background: var(--card);
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: .7rem 1rem;
      font-size: .95rem;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    button.secondary { background: #3d4f5c; }
    button.danger { background: var(--bad); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    #cameraBox {
      display: none;
      margin: .75rem 0 1rem;
      background: #0b1218;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }
    #cameraBox.active { display: block; }
    .cam-stage { position: relative; }
    video {
      width: 100%;
      display: block;
      max-height: 420px;
      object-fit: contain;
      background: #000;
    }
    #snap, #cropPreview {
      display: none;
      width: 100%;
      max-height: 120px;
      object-fit: contain;
      background: #000;
      margin-top: .4rem;
    }
    #cropPreview.show { display: block; }
    #candidates {
      display: none;
      flex-wrap: wrap;
      gap: .4rem;
      margin: .5rem 0 .75rem;
    }
    #candidates.show { display: flex; }
    #candidates button {
      background: #254556;
      letter-spacing: .06em;
      font-size: 1rem;
    }
    .guide {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 38%;
      height: 22%;
      border: 2px solid #7dd3fc;
      border-radius: 6px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,.45);
      pointer-events: none;
    }
    .guide-hint {
      position: absolute;
      left: 0; right: 0;
      top: calc(38% + 22% + 8px);
      text-align: center;
      color: #e8f4ff;
      font-size: .8rem;
      text-shadow: 0 1px 2px #000;
      pointer-events: none;
    }
    .cam-actions {
      display: flex;
      gap: .5rem;
      padding: .6rem;
      background: #111a22;
      flex-wrap: wrap;
    }
    #result {
      display: none;
      padding: 1rem;
      border-radius: 10px;
      margin: 1rem 0;
      border: 1px solid transparent;
    }
    #result.show { display: block; }
    #result.ok { background: var(--ok-bg); border-color: #9ad4b4; color: var(--ok); }
    #result.bad { background: var(--bad-bg); border-color: #f0b0b0; color: var(--bad); }
    #result .plate {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: .08em;
    }
    #result .meta { margin-top: .35rem; font-size: .95rem; }
    h2 {
      font-size: 1.05rem;
      margin: 1.5rem 0 .6rem;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: .75rem .9rem;
      margin-bottom: .5rem;
    }
    .item.expired { border-color: #e08a8a; background: #fff5f5; }
    .item .p {
      font-weight: 700;
      letter-spacing: .06em;
      font-size: 1.05rem;
    }
    .item .t {
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      font-size: .92rem;
    }
    .item.expired .t { color: var(--bad); font-weight: 700; }
    .empty { color: var(--muted); font-size: .92rem; }
    #status { color: var(--muted); font-size: .85rem; min-height: 1.2em; margin: .25rem 0 .5rem; }
    details {
      margin-top: 1.5rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: .75rem 1rem;
    }
    details summary { cursor: pointer; font-weight: 600; }
    .cat { margin: .75rem 0; }
    .cat b { display: block; margin-bottom: .25rem; }
    .cat span {
      display: inline-block;
      background: #eef3f6;
      border-radius: 4px;
      padding: .15rem .4rem;
      margin: .15rem .2rem 0 0;
      font-size: .8rem;
      letter-spacing: .04em;
    }
  </style>
</head>
<body>
  <main>
    <h1>License Plate Permit</h1>
    <p class="sub">Check permit · mark no-permit with 2-hour timer</p>

    <div class="row">
      <input id="plate" type="text" placeholder="Enter plate" autocomplete="off" />
      <button id="checkBtn" type="button">Check</button>
      <button id="scanBtn" type="button" class="secondary">Scan</button>
      <input id="fileScan" type="file" accept="image/*" capture="environment" hidden />
    </div>
    <div id="status"></div>
    <div id="candidates"></div>
    <img id="cropPreview" alt="" />

    <div id="cameraBox">
      <div class="cam-stage">
        <video id="video" playsinline autoplay muted></video>
        <div class="guide"></div>
        <div class="guide-hint">Fit plate inside the box</div>
      </div>
      <canvas id="snap"></canvas>
      <div class="cam-actions">
        <button id="captureBtn" type="button">Capture</button>
        <button id="photoBtn" type="button" class="secondary">Use photo</button>
        <button id="closeCamBtn" type="button" class="secondary">Close</button>
      </div>
    </div>

    <div id="result"></div>

    <h2>No permit (2-hour)</h2>
    <div id="noPermitList"><p class="empty">None</p></div>

    <details>
      <summary>Permit list</summary>
      <div id="permitBrowse"></div>
    </details>
  </main>

  <script>
    const PERMITS = {
      "TAI NAM": [
        "DT69485","DEB650","G62469","L141810","CH38534","C414736","Q810903",
        "6893368","DU3500","N230963","EJ46350","CZ13234","AT50779","ZU89687",
        "AK30545","DA97586","FC84182","9CPC706","EC44828","EB97941","AE61242","EQ34950"
      ],
      "LYNAMY": [
        "CE12665","AR15846","BT25189","EA86285","DM45617","EA49434","AY46141",
        "DB96722","FM60108","AR25354","AT42183","CC55865","V633110","C7603EL"
      ],
      "PHO VIET": ["AV79973"],
      "Tina": ["EF26988"],
      "Le, Tam": ["BF60353"],
      "Nguyen, Thuy Minh": ["FR96854"],
      "Ho, Lieu": ["Z977833"],
      "American Metro Bank": [
        "EK47459","BH56649","A4527EL","DQ54956","Z340036","R185590","L409136","EP19587"
      ],
      "Parents": [
        "CX44955","CJ40331","BT21234","EU84762","EU56434","FR92061","DXBQ77"
      ],
      "PORR, PETER": [
        "31766CV","37129CV","35819CV","AU94853"
      ],
      "Staff": [
        "L476742","FG24759","6499791","EE98203","E423176","EH69703","CY79924",
        "FH83593","ZX94543","AY54341","AHD6836","EP52891","Y711065","GA74745",
        "ZHUYU88","FD94877","DE46098","ER75463","DW19611","CY46783","DA47001","AX44302"
      ]
    };

    const TWO_HOURS = 2 * 60 * 60 * 1000;
    const STORE_KEY = "noPermitPlates_v1";

    function normalize(raw) {
      return String(raw || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    }

    function buildIndex() {
      const map = new Map();
      for (const [cat, plates] of Object.entries(PERMITS)) {
        for (const p of plates) {
          const n = normalize(p);
          if (!n) continue;
          if (!map.has(n)) map.set(n, []);
          const cats = map.get(n);
          if (!cats.includes(cat)) cats.push(cat);
        }
      }
      return map;
    }

    const INDEX = buildIndex();

    function loadNoPermit() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        const arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr : [];
      } catch {
        return [];
      }
    }

    function saveNoPermit(list) {
      localStorage.setItem(STORE_KEY, JSON.stringify(list));
    }

    function formatRemain(ms) {
      if (ms <= 0) return "EXPIRED";
      const s = Math.floor(ms / 1000);
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
    }

    const plateInput = document.getElementById("plate");
    const resultEl = document.getElementById("result");
    const listEl = document.getElementById("noPermitList");
    const statusEl = document.getElementById("status");
    const cameraBox = document.getElementById("cameraBox");
    const video = document.getElementById("video");
    const snap = document.getElementById("snap");
    let stream = null;
    let worker = null;

    function setStatus(msg) {
      statusEl.textContent = msg || "";
    }

    function showResult(ok, plate, detail) {
      resultEl.className = "show " + (ok ? "ok" : "bad");
      resultEl.innerHTML = `<div class="plate">${plate}</div><div class="meta">${detail}</div>`;
    }

    function checkPlate(raw) {
      const plate = normalize(raw);
      if (!plate) {
        setStatus("Enter a plate");
        return;
      }
      plateInput.value = plate;
      const cats = INDEX.get(plate);
      if (cats) {
        showResult(true, plate, "PERMITTED — " + cats.join(", "));
        setStatus("");
        return;
      }
      let list = loadNoPermit();
      const existing = list.find((x) => x.plate === plate);
      if (existing) {
        const left = existing.expiresAt - Date.now();
        showResult(false, plate, "NO PERMIT — already tracked · " + formatRemain(left));
      } else {
        const entry = { plate, startedAt: Date.now(), expiresAt: Date.now() + TWO_HOURS };
        list.unshift(entry);
        saveNoPermit(list);
        showResult(false, plate, "NO PERMIT — 2-hour countdown started");
      }
      setStatus("");
      renderList();
    }

    function removePlate(plate) {
      saveNoPermit(loadNoPermit().filter((x) => x.plate !== plate));
      renderList();
    }

    function renderList() {
      const list = loadNoPermit();
      if (!list.length) {
        listEl.innerHTML = '<p class="empty">None</p>';
        return;
      }
      const now = Date.now();
      listEl.innerHTML = "<ul>" + list.map((x) => {
        const left = x.expiresAt - now;
        const expired = left <= 0;
        return `<li class="item${expired ? " expired" : ""}" data-plate="${x.plate}">
          <div>
            <div class="p">${x.plate}</div>
            <div class="t">${formatRemain(left)}</div>
          </div>
          <button type="button" class="danger removeBtn">Remove</button>
        </li>`;
      }).join("") + "</ul>";
      listEl.querySelectorAll(".removeBtn").forEach((btn) => {
        btn.addEventListener("click", () => {
          removePlate(btn.closest(".item").dataset.plate);
        });
      });
    }

    function renderPermitBrowse() {
      const el = document.getElementById("permitBrowse");
      el.innerHTML = Object.entries(PERMITS).map(([cat, plates]) => {
        const uniq = [...new Set(plates.map(normalize))];
        return `<div class="cat"><b>${cat} (${uniq.length})</b>${uniq.map((p) => `<span>${p}</span>`).join("")}</div>`;
      }).join("");
    }

    function makeVariant(src, mode) {
      const scale = 2.5;
      const out = document.createElement("canvas");
      out.width = Math.max(1, Math.round(src.width * scale));
      out.height = Math.max(1, Math.round(src.height * scale));
      const ctx = out.getContext("2d");
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(src, 0, 0, out.width, out.height);
      const img = ctx.getImageData(0, 0, out.width, out.height);
      const d = img.data;
      let min = 255, max = 0;
      const gray = new Float32Array(out.width * out.height);
      for (let i = 0, p = 0; i < d.length; i += 4, p++) {
        const g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        gray[p] = g;
        if (g < min) min = g;
        if (g > max) max = g;
      }
      const range = Math.max(1, max - min);
      for (let i = 0, p = 0; i < d.length; i += 4, p++) {
        let g = ((gray[p] - min) / range) * 255;
        if (mode === "bin") g = g > 128 ? 255 : 0;
        else if (mode === "binInv") g = g > 128 ? 0 : 255;
        else if (mode === "inv") g = 255 - g;
        d[i] = d[i + 1] = d[i + 2] = g;
        d[i + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      return out;
    }

    function extractCandidates(text) {
      const found = new Set();
      const up = String(text || "").toUpperCase();
      const parts = up.match(/[A-Z0-9][A-Z0-9 \-]{3,14}[A-Z0-9]/g) || [];
      for (const s of parts) {
        const n = normalize(s);
        if (n.length >= 5 && n.length <= 8) found.add(n);
      }
      const raw = normalize(up);
      for (let len = 8; len >= 5; len--) {
        for (let i = 0; i <= raw.length - len; i++) found.add(raw.slice(i, i + len));
      }
      return [...found];
    }

    function editDist(a, b) {
      if (Math.abs(a.length - b.length) > 2) return 99;
      const m = a.length, n = b.length;
      const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
      for (let i = 0; i <= m; i++) dp[i][0] = i;
      for (let j = 0; j <= n; j++) dp[0][j] = j;
      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          dp[i][j] = a[i - 1] === b[j - 1]
            ? dp[i - 1][j - 1]
            : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
        }
      }
      return dp[m][n];
    }

    function scoreCandidate(p) {
      let score = p.length;
      if (INDEX.has(p)) score += 200;
      else {
        for (const known of INDEX.keys()) {
          const d = editDist(p, known);
          if (d === 1) { score += 80; break; }
          if (d === 2) { score += 30; break; }
        }
      }
      if (/[A-Z]/.test(p) && /\d/.test(p)) score += 12;
      if (/^[A-Z]+$/.test(p) || /^\d+$/.test(p)) score -= 10;
      return score;
    }

    function rankPlates(texts) {
      const all = new Set();
      for (const t of texts) extractCandidates(t).forEach((p) => all.add(p));
      for (const p of [...all]) {
        for (const known of INDEX.keys()) {
          if (editDist(p, known) <= 1) all.add(known);
        }
      }
      return [...all].sort((a, b) => scoreCandidate(b) - scoreCandidate(a)).slice(0, 6);
    }

    function showCandidates(list) {
      const box = document.getElementById("candidates");
      if (!list.length) {
        box.className = "";
        box.innerHTML = "";
        return;
      }
      box.className = "show";
      box.innerHTML = list.map((p) => `<button type="button" data-p="${p}">${p}</button>`).join("");
      box.querySelectorAll("button").forEach((btn) => {
        btn.addEventListener("click", () => {
          plateInput.value = btn.dataset.p;
          checkPlate(btn.dataset.p);
          showCandidates([]);
        });
      });
    }

    function guideCropFromVideo() {
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      const dispW = video.clientWidth;
      const dispH = video.clientHeight;
      const scale = Math.min(dispW / vw, dispH / vh);
      const drawnW = vw * scale;
      const drawnH = vh * scale;
      const offsetX = (dispW - drawnW) / 2;
      const offsetY = (dispH - drawnH) / 2;
      const gx = dispW * 0.08;
      const gy = dispH * 0.38;
      const gw = dispW * 0.84;
      const gh = dispH * 0.22;
      let sx = (gx - offsetX) / scale;
      let sy = (gy - offsetY) / scale;
      let sw = gw / scale;
      let sh = gh / scale;
      sx = Math.max(0, Math.min(vw - 1, sx));
      sy = Math.max(0, Math.min(vh - 1, sy));
      sw = Math.max(10, Math.min(vw - sx, sw));
      sh = Math.max(10, Math.min(vh - sy, sh));
      return { sx, sy, sw, sh };
    }

    async function ensureWorker() {
      if (!worker) {
        setStatus("Loading OCR…");
        worker = await Tesseract.createWorker("eng");
      }
      return worker;
    }

    async function ocrCanvas(src) {
      const w = await ensureWorker();
      const variants = [
        makeVariant(src, "contrast"),
        makeVariant(src, "bin"),
        makeVariant(src, "binInv"),
        makeVariant(src, "inv")
      ];
      const texts = [];
      for (const canvas of variants) {
        for (const psm of ["7", "8", "13"]) {
          await w.setParameters({
            tessedit_pageseg_mode: psm,
            tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
          });
          const { data: { text } } = await w.recognize(canvas);
          if (text && text.trim()) texts.push(text);
        }
      }
      return texts;
    }

    function showPreview(canvas) {
      const img = document.getElementById("cropPreview");
      img.src = canvas.toDataURL("image/jpeg", 0.9);
      img.className = "show";
    }

    async function runOcrOnCanvas(crop) {
      showPreview(crop);
      setStatus("Reading plate…");
      document.getElementById("captureBtn").disabled = true;
      document.getElementById("scanBtn").disabled = true;
      try {
        const texts = await ocrCanvas(crop);
        const ranked = rankPlates(texts);
        if (!ranked.length) {
          setStatus("No plate found — type it, or retake closer / brighter");
          showCandidates([]);
          return;
        }
        plateInput.value = ranked[0];
        showCandidates(ranked);
        setStatus("Tap a result below, or edit and Check");
        plateInput.focus();
        plateInput.select();
      } catch (e) {
        setStatus("OCR failed — type the plate");
      } finally {
        document.getElementById("captureBtn").disabled = false;
        document.getElementById("scanBtn").disabled = false;
      }
    }

    async function openCamera() {
      showCandidates([]);
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });
        video.srcObject = stream;
        cameraBox.classList.add("active");
        setStatus("Fit plate in the blue box, then Capture");
      } catch (e) {
        document.getElementById("fileScan").click();
      }
    }

    function closeCamera() {
      if (stream) {
        stream.getTracks().forEach((t) => t.stop());
        stream = null;
      }
      video.srcObject = null;
      cameraBox.classList.remove("active");
    }

    async function captureAndOcr() {
      if (!video.videoWidth) {
        setStatus("Camera not ready");
        return;
      }
      const { sx, sy, sw, sh } = guideCropFromVideo();
      const crop = document.createElement("canvas");
      crop.width = Math.round(sw);
      crop.height = Math.round(sh);
      crop.getContext("2d").drawImage(video, sx, sy, sw, sh, 0, 0, crop.width, crop.height);
      closeCamera();
      await runOcrOnCanvas(crop);
    }

    async function ocrFromFile(file) {
      if (!file) return;
      closeCamera();
      const bmp = await createImageBitmap(file);
      const canvas = document.createElement("canvas");
      canvas.width = bmp.width;
      canvas.height = bmp.height;
      canvas.getContext("2d").drawImage(bmp, 0, 0);
      bmp.close();
      const band = document.createElement("canvas");
      const y0 = Math.floor(canvas.height * 0.25);
      const h = Math.floor(canvas.height * 0.5);
      const x0 = Math.floor(canvas.width * 0.05);
      const w = Math.floor(canvas.width * 0.9);
      band.width = w;
      band.height = h;
      band.getContext("2d").drawImage(canvas, x0, y0, w, h, 0, 0, w, h);
      await runOcrOnCanvas(band);
    }

    document.getElementById("checkBtn").addEventListener("click", () => checkPlate(plateInput.value));
    plateInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") checkPlate(plateInput.value);
    });
    document.getElementById("scanBtn").addEventListener("click", openCamera);
    document.getElementById("photoBtn").addEventListener("click", () => {
      document.getElementById("fileScan").click();
    });
    document.getElementById("fileScan").addEventListener("change", (e) => {
      const f = e.target.files && e.target.files[0];
      e.target.value = "";
      ocrFromFile(f);
    });
    document.getElementById("closeCamBtn").addEventListener("click", () => {
      closeCamera();
      setStatus("");
    });
    document.getElementById("captureBtn").addEventListener("click", captureAndOcr);

    renderPermitBrowse();
    renderList();
    setInterval(renderList, 1000);
  </script>
</body>
</html>
