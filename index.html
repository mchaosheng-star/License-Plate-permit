<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>License Plate Permit</title>
  <style>
    :root {
      --bg: #e8eef2;
      --ink: #14202b;
      --muted: #5a6b78;
      --ok: #0f6b3c;
      --ok-bg: #d8f3e4;
      --bad: #9b1c1c;
      --bad-bg: #fde2e2;
      --line: #c5d0d8;
      --card: #ffffff;
      --accent: #1a5f8a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background:
        radial-gradient(ellipse at 10% 0%, #d4e4ef 0%, transparent 50%),
        radial-gradient(ellipse at 90% 20%, #cfe0d8 0%, transparent 45%),
        var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
    main { max-width: 720px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
    h1 { font-size: 1.45rem; margin: 0 0 .25rem; letter-spacing: -.02em; }
    .sub { color: var(--muted); font-size: .9rem; margin-bottom: 1.25rem; }
    .row { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: .75rem; }
    input[type="text"], input[type="password"] {
      flex: 1;
      min-width: 160px;
      padding: .7rem .85rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 1.15rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      background: var(--card);
    }
    input[type="password"] { text-transform: none; letter-spacing: normal; font-size: .95rem; }
    button {
      border: 0;
      border-radius: 8px;
      padding: .7rem 1rem;
      font-size: .95rem;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    button.secondary { background: #3d4f5c; }
    button.danger { background: var(--bad); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    #status { color: var(--muted); font-size: .85rem; min-height: 1.2em; margin: .25rem 0 .5rem; }
    #candidates {
      display: none;
      flex-wrap: wrap;
      gap: .4rem;
      margin: .5rem 0 .75rem;
    }
    #candidates.show { display: flex; }
    #candidates button { background: #254556; letter-spacing: .06em; font-size: 1rem; }
    #previewWrap {
      display: none;
      margin: .5rem 0 1rem;
      background: #0b1218;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }
    #previewWrap.show { display: block; }
    #previewWrap img { width: 100%; display: block; max-height: 360px; object-fit: contain; background: #000; }
    #previewWrap .cam-x {
      position: absolute;
      top: .45rem;
      right: .45rem;
      z-index: 2;
      width: 2.2rem;
      height: 2.2rem;
      padding: 0;
      border-radius: 999px;
      background: rgba(20, 28, 36, .85);
      font-size: 1.2rem;
      line-height: 1;
    }
    #cameraBox {
      display: none;
      margin: .75rem 0 1rem;
      background: #0b1218;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }
    #cameraBox.active { display: block; }
    .cam-stage { position: relative; }
    video {
      width: 100%;
      display: block;
      max-height: 420px;
      object-fit: contain;
      background: #000;
    }
    .guide {
      position: absolute;
      left: 6%;
      right: 6%;
      top: 30%;
      height: 34%;
      border: 2px solid #7dd3fc;
      border-radius: 6px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,.4);
      pointer-events: none;
    }
    .guide-hint {
      position: absolute;
      left: 0; right: 0;
      bottom: .7rem;
      text-align: center;
      color: #e8f4ff;
      font-size: .8rem;
      text-shadow: 0 1px 2px #000;
      pointer-events: none;
    }
    .cam-x {
      position: absolute;
      top: .45rem;
      right: .45rem;
      z-index: 2;
      width: 2.2rem;
      height: 2.2rem;
      padding: 0;
      border-radius: 999px;
      background: rgba(20, 28, 36, .85);
      font-size: 1.2rem;
      line-height: 1;
    }
    .cam-actions {
      display: flex;
      gap: .5rem;
      padding: .6rem;
      background: #111a22;
      flex-wrap: wrap;
    }
    #result {
      display: none;
      padding: 1rem;
      border-radius: 10px;
      margin: 1rem 0;
      border: 1px solid transparent;
    }
    #result.show { display: block; }
    #result.ok { background: var(--ok-bg); border-color: #9ad4b4; color: var(--ok); }
    #result.bad { background: var(--bad-bg); border-color: #f0b0b0; color: var(--bad); }
    #result .plate { font-size: 1.6rem; font-weight: 700; letter-spacing: .08em; }
    #result .meta { margin-top: .35rem; font-size: .95rem; }
    h2 { font-size: 1.05rem; margin: 1.5rem 0 .6rem; }
    ul { list-style: none; padding: 0; margin: 0; }
    .item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: .75rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: .75rem .9rem;
      margin-bottom: .5rem;
    }
    .item-main { display: flex; gap: .65rem; align-items: flex-start; min-width: 0; flex: 1; }
    .item .thumb {
      width: 72px;
      height: 54px;
      object-fit: cover;
      border-radius: 6px;
      background: #111;
      flex-shrink: 0;
      cursor: pointer;
    }
    .item .no-photo {
      width: 72px;
      height: 54px;
      border-radius: 6px;
      background: #eef3f6;
      color: var(--muted);
      font-size: .65rem;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex-shrink: 0;
      padding: .2rem;
    }
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0,0,0,.88);
      padding: 1rem;
      align-items: center;
      justify-content: center;
    }
    #lightbox.show { display: flex; }
    #lightbox img {
      max-width: 100%;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 8px;
    }
    #lightbox .close-lb {
      position: absolute;
      top: .75rem;
      right: .75rem;
    }
    #result .ref-photo {
      margin-top: .75rem;
      max-width: 100%;
      max-height: 220px;
      border-radius: 8px;
      display: block;
      cursor: pointer;
    }
    .item.expired { border-color: #e08a8a; background: #fff5f5; }
    .item .p { font-weight: 700; letter-spacing: .06em; font-size: 1.05rem; }
    .item .t { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .92rem; }
    .item.expired .t { color: var(--bad); font-weight: 700; }
    .empty { color: var(--muted); font-size: .92rem; }
    details {
      margin-top: 1.5rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: .75rem 1rem;
    }
    details summary { cursor: pointer; font-weight: 600; }
    .cat { margin: .75rem 0; }
    .cat b { display: block; margin-bottom: .25rem; }
    .cat span {
      display: inline-block;
      background: #eef3f6;
      border-radius: 4px;
      padding: .15rem .4rem;
      margin: .15rem .2rem 0 0;
      font-size: .8rem;
      letter-spacing: .04em;
    }
    .hint { color: var(--muted); font-size: .85rem; margin: .4rem 0 .75rem; line-height: 1.4; }
    .hint a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>License Plate Permit</h1>
    <p class="sub">Check permit · mark no-permit with 2-hour timer</p>

    <div class="row">
      <input id="plate" type="text" placeholder="Enter plate" autocomplete="off" enterkeyhint="done" />
      <button id="checkBtn" type="button">Check</button>
      <button id="scanBtn" type="button" class="secondary">Scan</button>
      <input id="fileScan" type="file" accept="image/*" capture="environment" hidden />
    </div>
    <div id="status"></div>
    <div id="candidates"></div>

    <div id="previewWrap">
      <button id="closePreview" type="button" class="cam-x" aria-label="Close">×</button>
      <img id="cropPreview" alt="Captured plate" />
    </div>

    <div id="cameraBox">
      <div class="cam-stage">
        <button id="closeCamX" type="button" class="cam-x" aria-label="Close camera">×</button>
        <video id="video" playsinline webkit-playsinline autoplay muted></video>
        <div class="guide"></div>
        <div class="guide-hint">Fill the box with the plate</div>
      </div>
      <div class="cam-actions">
        <button id="captureBtn" type="button">Capture</button>
        <button id="photoBtn" type="button" class="secondary">Take photo</button>
        <button id="closeCamBtn" type="button" class="danger">Close camera</button>
      </div>
    </div>

    <div id="result"></div>

    <div id="lightbox">
      <button type="button" class="danger close-lb" id="closeLightbox">Close</button>
      <img id="lightboxImg" alt="Vehicle reference" />
    </div>

    <h2>No permit (2-hour)</h2>
    <div id="noPermitList"><p class="empty">None</p></div>

    <details id="apiSettings">
      <summary>Scan setup (required for auto-read)</summary>
      <p class="hint">Phone OCR cannot read plates well. Free Plate Recognizer token (~2500 scans/month): <a href="https://app.platerecognizer.com/accounts/signup/" target="_blank" rel="noopener">sign up</a> → copy API Token → paste below.</p>
      <div class="row">
        <input id="apiToken" type="password" placeholder="Plate Recognizer API token" autocomplete="off" />
        <button id="saveToken" type="button">Save</button>
      </div>
      <div id="tokenStatus" class="hint"></div>
    </details>

    <details>
      <summary>Permit list</summary>
      <div id="permitBrowse"></div>
    </details>
  </main>

  <script>
    const PERMITS = {
      "TAI NAM": [
        "DT69485","DEB650","G62469","L141810","CH38534","C414736","Q810903",
        "6893368","DU3500","N230963","EJ46350","CZ13234","AT50779","ZU89687",
        "AK30545","DA97586","FC84182","9CPC706","EC44828","EB97941","AE61242","EQ34950"
      ],
      "LYNAMY": [
        "CE12665","AR15846","BT25189","EA86285","DM45617","EA49434","AY46141",
        "DB96722","FM60108","AR25354","AT42183","CC55865","V633110","C7603EL"
      ],
      "PHO VIET": ["AV79973"],
      "Tina": ["EF26988"],
      "Le, Tam": ["BF60353"],
      "Nguyen, Thuy Minh": ["FR96854"],
      "Ho, Lieu": ["Z977833"],
      "American Metro Bank": [
        "EK47459","BH56649","A4527EL","DQ54956","Z340036","R185590","L409136","EP19587"
      ],
      "Parents": [
        "CX44955","CJ40331","BT21234","EU84762","EU56434","FR92061","DXBQ77"
      ],
      "PORR, PETER": [
        "31766CV","37129CV","35819CV","AU94853"
      ],
      "Staff": [
        "L476742","FG24759","6499791","EE98203","E423176","EH69703","CY79924",
        "FH83593","ZX94543","AY54341","AHD6836","EP52891","Y711065","GA74745",
        "ZHUYU88","FD94877","DE46098","ER75463","DW19611","CY46783","DA47001","AX44302"
      ]
    };

    const TWO_HOURS = 2 * 60 * 60 * 1000;
    const STORE_KEY = "noPermitPlates_v1";
    const TOKEN_KEY = "plateRecognizerToken";

    function normalize(raw) {
      return String(raw || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    }

    function buildIndex() {
      const map = new Map();
      for (const [cat, plates] of Object.entries(PERMITS)) {
        for (const p of plates) {
          const n = normalize(p);
          if (!n) continue;
          if (!map.has(n)) map.set(n, []);
          const cats = map.get(n);
          if (!cats.includes(cat)) cats.push(cat);
        }
      }
      return map;
    }

    const INDEX = buildIndex();
    const plateInput = document.getElementById("plate");
    const resultEl = document.getElementById("result");
    const listEl = document.getElementById("noPermitList");
    const statusEl = document.getElementById("status");
    const cameraBox = document.getElementById("cameraBox");
    const video = document.getElementById("video");
    const previewWrap = document.getElementById("previewWrap");
    const cropPreview = document.getElementById("cropPreview");
    let stream = null;
    let lastCaptureDataUrl = "";

    function getToken() {
      return (localStorage.getItem(TOKEN_KEY) || "").trim();
    }

    function setStatus(msg) {
      statusEl.textContent = msg || "";
    }

    function refreshTokenStatus() {
      const el = document.getElementById("tokenStatus");
      el.textContent = getToken() ? "Token saved — Scan can auto-read plates." : "No token — Scan shows photo; type the plate.";
      document.getElementById("apiToken").value = getToken();
    }

    function loadNoPermit() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        const arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr : [];
      } catch {
        return [];
      }
    }

    function saveNoPermit(list) {
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify(list));
      } catch {
        const slim = list.map(({ photo, ...rest }, i) => i < 8 ? { ...rest, photo } : rest);
        try {
          localStorage.setItem(STORE_KEY, JSON.stringify(slim));
        } catch {
          localStorage.setItem(STORE_KEY, JSON.stringify(list.map(({ photo, ...rest }) => rest)));
          setStatus("Storage full — photos dropped, plates kept");
        }
      }
    }

    function formatRemain(ms) {
      if (ms <= 0) return "EXPIRED";
      const s = Math.floor(ms / 1000);
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
    }

    function openLightbox(src) {
      if (!src) return;
      document.getElementById("lightboxImg").src = src;
      document.getElementById("lightbox").classList.add("show");
    }

    function closeLightbox() {
      document.getElementById("lightbox").classList.remove("show");
      document.getElementById("lightboxImg").removeAttribute("src");
    }

    function showResult(ok, plate, detail, photo) {
      resultEl.className = "show " + (ok ? "ok" : "bad");
      const img = !ok && photo
        ? `<img class="ref-photo" src="${photo}" alt="Vehicle reference" data-full="1" />`
        : "";
      resultEl.innerHTML = `<div class="plate">${plate}</div><div class="meta">${detail}</div>${img}`;
      const ref = resultEl.querySelector(".ref-photo");
      if (ref) ref.addEventListener("click", () => openLightbox(photo));
    }

    async function blobToDataUrl(blob, maxW = 900, quality = 0.72) {
      const bmp = await createImageBitmap(blob);
      const scale = Math.min(1, maxW / bmp.width);
      const w = Math.max(1, Math.round(bmp.width * scale));
      const h = Math.max(1, Math.round(bmp.height * scale));
      const c = document.createElement("canvas");
      c.width = w;
      c.height = h;
      c.getContext("2d").drawImage(bmp, 0, 0, w, h);
      bmp.close();
      return c.toDataURL("image/jpeg", quality);
    }

    function checkPlate(raw) {
      const plate = normalize(raw);
      if (!plate) {
        setStatus("Enter a plate");
        return;
      }
      plateInput.value = plate;
      const cats = INDEX.get(plate);
      if (cats) {
        showResult(true, plate, "PERMITTED — " + cats.join(", "));
        setStatus("");
        return;
      }
      let list = loadNoPermit();
      const existing = list.find((x) => x.plate === plate);
      const photo = lastCaptureDataUrl || (existing && existing.photo) || "";
      if (existing) {
        if (lastCaptureDataUrl) {
          existing.photo = lastCaptureDataUrl;
          saveNoPermit(list);
        }
        showResult(false, plate, "NO PERMIT — already tracked · " + formatRemain(existing.expiresAt - Date.now()), existing.photo || photo);
      } else {
        list.unshift({
          plate,
          startedAt: Date.now(),
          expiresAt: Date.now() + TWO_HOURS,
          photo: lastCaptureDataUrl || ""
        });
        saveNoPermit(list);
        showResult(false, plate, "NO PERMIT — 2-hour countdown started", lastCaptureDataUrl || "");
      }
      setStatus("");
      renderList();
    }

    function removePlate(plate) {
      saveNoPermit(loadNoPermit().filter((x) => x.plate !== plate));
      renderList();
    }

    function renderList() {
      const list = loadNoPermit();
      if (!list.length) {
        listEl.innerHTML = '<p class="empty">None</p>';
        return;
      }
      const now = Date.now();
      listEl.innerHTML = "<ul>" + list.map((x) => {
        const left = x.expiresAt - now;
        const expired = left <= 0;
        const thumb = x.photo
          ? `<img class="thumb" src="${x.photo}" alt="" data-photo="1" />`
          : `<div class="no-photo">No photo</div>`;
        return `<li class="item${expired ? " expired" : ""}" data-plate="${x.plate}">
          <div class="item-main">
            ${thumb}
            <div>
              <div class="p">${x.plate}</div>
              <div class="t">${formatRemain(left)}</div>
            </div>
          </div>
          <button type="button" class="danger removeBtn">Remove</button>
        </li>`;
      }).join("") + "</ul>";
      listEl.querySelectorAll(".removeBtn").forEach((btn) => {
        btn.addEventListener("click", () => removePlate(btn.closest(".item").dataset.plate));
      });
      listEl.querySelectorAll(".thumb").forEach((img) => {
        img.addEventListener("click", () => openLightbox(img.src));
      });
    }

    function renderPermitBrowse() {
      document.getElementById("permitBrowse").innerHTML = Object.entries(PERMITS).map(([cat, plates]) => {
        const uniq = [...new Set(plates.map(normalize))];
        return `<div class="cat"><b>${cat} (${uniq.length})</b>${uniq.map((p) => `<span>${p}</span>`).join("")}</div>`;
      }).join("");
    }

    function showCandidates(list) {
      const box = document.getElementById("candidates");
      if (!list.length) {
        box.className = "";
        box.innerHTML = "";
        return;
      }
      box.className = "show";
      box.innerHTML = list.map((p) => `<button type="button" data-p="${p}">${p}</button>`).join("");
      box.querySelectorAll("button").forEach((btn) => {
        btn.addEventListener("click", () => {
          checkPlate(btn.dataset.p);
          showCandidates([]);
        });
      });
    }

    function showPreviewUrl(url) {
      cropPreview.src = url;
      previewWrap.classList.add("show");
    }

    function hidePreview() {
      previewWrap.classList.remove("show");
      cropPreview.removeAttribute("src");
    }

    function canvasToBlob(canvas) {
      return new Promise((resolve) => canvas.toBlob((b) => resolve(b), "image/jpeg", 0.92));
    }

    async function readPlatesFromBlob(blob) {
      const token = getToken();
      if (!token) return [];
      const fd = new FormData();
      fd.append("upload", blob, "plate.jpg");
      fd.append("regions", "us");
      const res = await fetch("https://api.platerecognizer.com/v1/plate-reader/", {
        method: "POST",
        headers: { Authorization: "Token " + token },
        body: fd
      });
      if (!res.ok) {
        const t = await res.text();
        throw new Error(res.status + " " + t.slice(0, 120));
      }
      const data = await res.json();
      const plates = (data.results || [])
        .sort((a, b) => (b.score || 0) - (a.score || 0))
        .map((r) => normalize(r.plate))
        .filter((p) => p.length >= 4);
      return [...new Set(plates)];
    }

    async function processImageBlob(blob) {
      lastCaptureDataUrl = await blobToDataUrl(blob);
      showPreviewUrl(lastCaptureDataUrl);
      showCandidates([]);
      plateInput.focus();

      if (!getToken()) {
        setStatus("Type the plate from the photo (or add API token in Scan setup)");
        document.getElementById("apiSettings").open = true;
        return;
      }

      setStatus("Reading plate…");
      document.getElementById("scanBtn").disabled = true;
      document.getElementById("captureBtn").disabled = true;
      try {
        const plates = await readPlatesFromBlob(blob);
        if (!plates.length) {
          setStatus("No plate found — type it from the photo");
          return;
        }
        plateInput.value = plates[0];
        showCandidates(plates);
        setStatus("Tap a result, or edit and Check");
        plateInput.select();
      } catch (e) {
        setStatus("Read failed — type from photo. Check API token.");
        document.getElementById("apiSettings").open = true;
      } finally {
        document.getElementById("scanBtn").disabled = false;
        document.getElementById("captureBtn").disabled = false;
      }
    }

    async function openCamera() {
      showCandidates([]);
      hidePreview();
      if (!getToken()) {
        document.getElementById("fileScan").click();
        return;
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });
        video.srcObject = stream;
        await video.play().catch(() => {});
        cameraBox.classList.add("active");
        setStatus("Fill box with plate, then Capture");
      } catch (e) {
        document.getElementById("fileScan").click();
      }
    }

    function closeCamera() {
      if (stream) {
        stream.getTracks().forEach((t) => t.stop());
        stream = null;
      }
      video.srcObject = null;
      cameraBox.classList.remove("active");
    }

    async function captureFullFrame() {
      const w = video.videoWidth;
      const h = video.videoHeight;
      if (!w || !h) {
        setStatus("Camera not ready — wait a second");
        return;
      }
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      canvas.getContext("2d").drawImage(video, 0, 0, w, h);
      closeCamera();
      const blob = await canvasToBlob(canvas);
      if (!blob) {
        setStatus("Capture failed");
        return;
      }
      await processImageBlob(blob);
    }

    document.getElementById("checkBtn").addEventListener("click", () => checkPlate(plateInput.value));
    plateInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") checkPlate(plateInput.value);
    });
    document.getElementById("scanBtn").addEventListener("click", openCamera);
    document.getElementById("photoBtn").addEventListener("click", () => {
      document.getElementById("fileScan").click();
    });
    document.getElementById("fileScan").addEventListener("change", async (e) => {
      const f = e.target.files && e.target.files[0];
      e.target.value = "";
      if (!f) return;
      closeCamera();
      await processImageBlob(f);
    });
    document.getElementById("captureBtn").addEventListener("click", captureFullFrame);
    document.getElementById("closeCamBtn").addEventListener("click", () => {
      closeCamera();
      setStatus("");
    });
    document.getElementById("closeCamX").addEventListener("click", () => {
      closeCamera();
      setStatus("");
    });
    document.getElementById("closePreview").addEventListener("click", hidePreview);
    document.getElementById("closeLightbox").addEventListener("click", closeLightbox);
    document.getElementById("lightbox").addEventListener("click", (e) => {
      if (e.target.id === "lightbox") closeLightbox();
    });
    document.getElementById("saveToken").addEventListener("click", () => {
      const v = document.getElementById("apiToken").value.trim();
      if (v) localStorage.setItem(TOKEN_KEY, v);
      else localStorage.removeItem(TOKEN_KEY);
      refreshTokenStatus();
      setStatus(v ? "Token saved" : "Token cleared");
    });

    function tickTimers() {
      const now = Date.now();
      listEl.querySelectorAll(".item").forEach((item) => {
        const plate = item.dataset.plate;
        const entry = loadNoPermit().find((x) => x.plate === plate);
        if (!entry) return;
        const left = entry.expiresAt - now;
        const t = item.querySelector(".t");
        if (t) t.textContent = formatRemain(left);
        item.classList.toggle("expired", left <= 0);
      });
    }

    refreshTokenStatus();
    renderPermitBrowse();
    renderList();
    setInterval(tickTimers, 1000);
  </script>
</body>
</html>
